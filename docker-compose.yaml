services:
  db:
    image: mariadb:latest
    container_name: db
    command:
      - "--general-log=1"
      - "--general-log-file=/var/log/mysql/general.log"
      - "--log_error=/var/log/mysql/error.log"
      - "--slow_query_log=1"
      - "--slow_query_log_file=/var/log/mysql/slow-query.log"
      - "--long_query_time=2"
      - "--log_queries_not_using_indexes=1"
    restart: unless-stopped
    ports:
      - "3306:3306"
    env_file:
      - dev.env
    volumes:
      - "db_logs:/db/log:/var/log/mysql"
      - "db_data:/var/lib/mysql"
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      start_period: 30s
      start_interval: 1s
      interval: 10s
      timeout: 3s
      retries: 3

  db-admin:
    image: arm64v8/phpmyadmin:latest
    container_name: db-admin
    restart: unless-stopped
    ports:
      - "8001:80"
    links:
      - db
    env_file:
      - dev.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:80" ]
      start_period: 30s
      start_interval: 1s
      interval: 10s
      timeout: 3s
      retries: 3

  broker:
    image: rabbitmq:latest
    container_name: broker
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "8002:15672"
    env_file:
      - dev.env
    configs:
      - source: broker-config
        target: /etc/rabbitmq/rabbitmq.conf
      - source: broker-plugins
        target: /etc/rabbitmq/enabled_plugins
    volumes:
      - "broker_logs:/broker/log:/var/log/rabbitmq/"
      - "broker_data:/broker/data:/var/lib/rabbitmq/"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      start_period: 30s
      start_interval: 1s
      interval: 10s
      timeout: 3s
      retries: 3

  broker-admin:
    image: mher/flower:latest
    container_name: broker-admin
    restart: unless-stopped
    ports:
      - "8003:5555"
    links:
      - broker
    env_file:
      - dev.env
    depends_on:
      broker:
        condition: service_healthy

configs:
  broker-config:
    content: "deprecated_features.permit.transient_nonexcl_queues = true"
  broker-plugins:
    content: "[rabbitmq_management]."

volumes:
  db_logs:
    driver: local
  db_data:
    driver: local
  broker_logs:
    driver: local
  broker_data:
    driver: local