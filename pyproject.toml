[project]
name = "nicegui-admin-new"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "nicegui>=3.11.1",
    "pydantic>=2.13.3",
    "pydantic-settings>=2.14.0",
    "pymysql>=1.1.3",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.49",
    "starlette>=1.0.0",
    "typer>=0.25.1",
    "uvicorn>=0.46.0",
]

[build-system]
requires = ["uv_build>=0.11.9,<0.12"]
build-backend = "uv_build"

[tool.uv.sources]
nicegui-admin_mailing = { workspace = true }

[tool.uv.workspace]
members = ["extensions/*"]
