[project]
name = "nicegui-admin_mailing"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "celery>=5.6.3",
    "celery-types>=0.26.0",
    "fastapi>=0.136.1",
    "html2text>=2025.4.15",
    "nicegui>=3.11.1",
